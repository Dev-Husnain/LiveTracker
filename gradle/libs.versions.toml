[versions]
agp = "8.9.2"
kotlin = "2.1.20"
coreKtx = "1.16.0"
lifecycleRuntimeKtx = "2.8.7"
activityCompose = "1.10.1"
composeBom = "2025.04.01"

foundation = "1.8.0"
navigationRuntimeKtx = "2.8.9"
lifecycle = "2.8.7"
mapsCompose = "6.1.2"
playServicesLocation = "21.3.0"
mapsPlatformVersion = "2.0.1"

koinVer = "3.5.6"
ktorVersion = "3.1.1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
lifeCycleRuntimeKtx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }

koin = { group = "io.insert-koin", name = "koin-androidx-compose", version.ref = "koinVer" }

#Ktor
ktorOkhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktorVersion" }
ktorCore = { module = "io.ktor:ktor-client-core", version.ref = "ktorVersion" }
ktorSerialization = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktorVersion" }
ktorNegotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktorVersion" }


androidxFoundation = { module = "androidx.compose.foundation:foundation", version.ref = "foundation" }
navigationCompose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationRuntimeKtx" }
navigationRuntimeKtx = { module = "androidx.navigation:navigation-runtime-ktx", version.ref = "navigationRuntimeKtx" }
lifecycleLivedataKtx = { module = "androidx.lifecycle:lifecycle-livedata-ktx", version.ref = "lifecycle" }
lifecycleProcess = { module = "androidx.lifecycle:lifecycle-process", version.ref = "lifecycle" }

#Google
maps-compose = { module = "com.google.maps.android:maps-compose", version.ref = "mapsCompose" }
maps-utils-compose = { module = "com.google.maps.android:maps-compose-utils", version.ref = "mapsCompose" }
play-services-location = { module = "com.google.android.gms:play-services-location", version.ref = "playServicesLocation" }


[bundles]
googleMap = ["maps-compose",
    "play-services-location",
    "maps-utils-compose"]

compose = [
    "androidx-compose-bom",
    "androidx-ui-graphics",
    "navigationCompose",
    "navigationRuntimeKtx",
    "androidx-ui-tooling",
    "androidx-activity-compose",
    "androidx-ui",
    "androidx-ui-tooling-preview",
    "androidx-material3",
    "lifeCycleRuntimeKtx",
    "androidxFoundation"
]

ktor = ["ktorOkhttp",
    "ktorCore",
    "ktorSerialization",
    "ktorNegotiation"]

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
mapsPlatformPlugin = { id = "com.google.android.libraries.mapsplatform.secrets-gradle-plugin", version.ref = "mapsPlatformVersion" }
android-library = { id = "com.android.library", version.ref = "agp" }

